# Survivor-only topology while rebuilding a failed DC2.
# Apply during doc 08 Phase 2 tear-down; re-apply mission-control-cluster-2-dcs.yaml to re-add DC2.
apiVersion: missioncontrol.datastax.com/v1beta2
kind: MissionControlCluster
metadata:
  name: hcd
  namespace: hcd
spec:
  createIssuer: true
  dataApi: {}
  encryption:
    internodeEncryption:
      certs:
        createCerts: true
      enabled: true
  k8ssandra:
    auth: true
    cassandra:
      config:
        jvmOptions:
          gc: G1GC
          heapSize: 512Mi
      serverType: hcd
      serverVersion: "1.2.5"
      superuserSecretRef:
        name: hcd-superuser
      storageConfig:
        cassandraDataVolumeClaimSpec:
          storageClassName: standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
      resources:
        requests:
          cpu: 500m
          memory: 1280Mi
        limits:
          cpu: "2"
          memory: 1536Mi
      datacenters:
        - metadata:
            name: hcd-dc1
          datacenterName: dc1
          size: 3
          racks:
            - name: rack1
              nodeAffinityLabels:
                mission-control.datastax.com/role: database
                topology.kubernetes.io/region: dc1
                topology.kubernetes.io/zone: rack1
            - name: rack2
              nodeAffinityLabels:
                mission-control.datastax.com/role: database
                topology.kubernetes.io/region: dc1
                topology.kubernetes.io/zone: rack2
            - name: rack3
              nodeAffinityLabels:
                mission-control.datastax.com/role: database
                topology.kubernetes.io/region: dc1
                topology.kubernetes.io/zone: rack3
